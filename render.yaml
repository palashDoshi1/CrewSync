services:
  - type: web
    name: crewsync-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: CREWSYNC_PUBLIC_DEMO
        value: "true"
      - key: LUMINAL_BASE_URL
        value: https://flash.luminal.cloud/v1
      - key: LUMINAL_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash
